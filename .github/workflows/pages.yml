name: Publish Daily Reports

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare local configs
        run: |
          cp block1/config.example.json block1/config.json
          cp block3/config.example.json block3/config.json
          cp block4/config.example.json block4/config.json

      - name: Prepare output directories
        run: |
          rm -rf _generated _site _history
          mkdir -p _generated _site

      - name: Restore historical reports
        run: |
          if git ls-remote --exit-code --heads origin pages-history >/dev/null 2>&1; then
            git fetch origin pages-history:pages-history
            git worktree add _history pages-history
            cp -R _history/. _site/
            rm -rf _site/.git
          fi

      - name: Generate reports
        run: |
          python -m block1.main --out _generated/trends
          python -m block3.main --out _generated/new_domains
          python -m block4.main --out _generated/digests

      - name: Stage Pages site
        run: |
          mkdir -p _site
          mkdir -p _site/trends _site/new_domains _site/digests
          cp -R _generated/trends/. _site/trends/
          cp -R _generated/new_domains/. _site/new_domains/
          cp -R _generated/digests/. _site/digests/
          python - <<'PY'
          from pathlib import Path

          SITE = Path("_site")
          SECTIONS = (
              ("trends", "Trend Research Reports"),
              ("new_domains", "New Domain Research Reports"),
              ("digests", "Community Signal Digests"),
          )
          STYLE = 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 0 auto; padding: 40px 24px; color: #1f2328; line-height: 1.6; } h1 { font-size: 28px; margin-bottom: 8px; } p { color: #57606a; } ul { padding-left: 20px; } a { color: #0969da; }'

          def page(title, body):
              return f'<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{title}</title><style>{STYLE}</style></head><body>{body}</body></html>'

          section_links = []
          for dirname, title in SECTIONS:
              directory = SITE / dirname
              reports = sorted((path for path in directory.glob("*.html") if path.name != "index.html"), reverse=True)
              links = "".join(f'<li><a href="{report.name}">{report.stem}</a></li>' for report in reports)
              directory.joinpath("index.html").write_text(page(title, f"<h1>{title}</h1><ul>{links}</ul>"), encoding="utf-8")
              latest = reports[0].name if reports else "index.html"
              section_links.append(f'<li><a href="{dirname}/{latest}">{title}</a></li>')

          body = "<h1>Keyword Research Daily Reports</h1><p>Generated by the scheduled GitHub Actions workflow.</p><ul>" + "".join(section_links) + "</ul>"
          SITE.joinpath("index.html").write_text(page("Keyword Research Daily Reports", body), encoding="utf-8")
          PY

      - name: Save historical reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -e _history/.git ]; then
            git worktree add --detach _history
            cd _history
            git checkout --orphan pages-history
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          rsync -a --delete --exclude .git _site/ _history/
          cd _history
          git add .
          if git diff --staged --quiet; then
            echo "No historical report changes to save."
          else
            git commit -m "Update published reports"
            git push origin HEAD:pages-history
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
